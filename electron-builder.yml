# electron-builder 打包配置（npm run dist / CI release 流水线共用）
# macOS 使用 ad-hoc 签名：可避免下载后的 App 被判定为“已损坏”，但仍需用户右键打开绕过 Gatekeeper。
# 正式免提示分发仍需 Developer ID 签名与 notarization；Windows 可能触发 SmartScreen 提示。
appId: com.screenrecorder.app
productName: Lenza
directories:
  output: release

publish:
  provider: github
  owner: tianyu0919
  repo: screen-recorder

files:
  - package.json
  - dist-electron/**

# uiohook-napi 是 N-API 预编译原生模块，必须从 asar 解出才能被 require
asarUnpack:
  - node_modules/uiohook-napi/**

mac:
  category: public.app-category.productivity
  # 无 Developer ID 时也必须重签整个 App bundle，否则 Electron 自带的局部签名会在 Gatekeeper 校验时报“已损坏”。
  identity: "-"
  # ad-hoc 签名没有 Team ID，启用 hardened runtime 会与预签名 Electron frameworks 的 Team ID 冲突。
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  extraResources:
    # 原生“关于 Lenza”面板会从 bundle Resources 读取并渲染可点击链接。
    - from: build/Credits.html
      to: Credits.html
    # macOS 系统音频原生 helper（electron/capture/systemAudio/darwin.ts 按 resourcesPath/sck-audio 引用）
    - from: native/sck-audio/bin/sck-audio
      to: sck-audio
    # macOS 窗口几何采样 helper（electron/capture/windowGeometry/darwin.ts 按 resourcesPath/window-geometry 引用）
    - from: native/window-geometry/darwin/bin/window-geometry
      to: window-geometry
    - from: native/whisper-caption/bin/darwin
      to: whisper-caption

win:
  target: nsis
  extraResources:
    # Windows 系统音频原生 helper（electron/capture/systemAudio/win32.ts 按 resourcesPath/wasapi-audio.exe 引用）
    - from: native/wasapi-audio/bin/wasapi-audio.exe
      to: wasapi-audio.exe
    # Windows 窗口几何采样 helper（electron/capture/windowGeometry/win32.ts 按 resourcesPath/window-geometry.exe 引用）
    - from: native/window-geometry/win32/bin/window-geometry.exe
      to: window-geometry.exe
    - from: native/whisper-caption/bin/win32
      to: whisper-caption
    # Windows 托盘图标（electron/main/index.ts 按 resourcesPath/tray-icon.ico 引用）
    - from: build/icon.ico
      to: tray-icon.ico

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  createDesktopShortcut: true
  runAfterFinish: true
  shortcutName: Lenza

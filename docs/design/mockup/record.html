<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="base.css" />
<style>
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 28px 0;
    flex: none;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .logo {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(140deg, #ff7a52, #e83e1a);
    display: grid;
    place-items: center;
    box-shadow: 0 2px 10px rgba(255, 92, 56, 0.35);
  }
  .brand h1 {
    font-size: 15px;
    font-weight: 650;
  }
  .brand p {
    font-size: 11.5px;
    color: var(--text-3);
  }
  .perm-row {
    display: flex;
    gap: 8px;
    padding: 14px 28px 0;
    flex: none;
  }
  .content {
    flex: 1;
    padding: 18px 28px 0;
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-head h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
  }
  .section-head .count {
    font-size: 12px;
    color: var(--text-3);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .src {
    border: 1px solid var(--border);
    background: var(--surface-1);
    border-radius: 12px;
    padding: 8px;
    text-align: left;
    position: relative;
  }
  .src.sel {
    border-color: var(--accent-border);
    background: var(--accent-soft);
    box-shadow: 0 0 0 3px rgba(255, 92, 56, 0.12);
  }
  .src .thumb {
    aspect-ratio: 16 / 10;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .src .meta {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 2px 2px;
  }
  .src .meta svg { color: var(--text-3); flex: none; }
  .src .meta .name {
    font-size: 12.5px;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .src .meta .name small {
    color: var(--text-3);
    font-size: 11px;
  }
  .src .badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    height: 20px;
    padding: 0 8px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .t-screen { background: linear-gradient(155deg, #2b3a55 0%, #151c2c 70%); }
  .t-screen-2 { background: linear-gradient(155deg, #3d2f4d 0%, #1c1626 70%); }
  .mini {
    position: absolute;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
  }
  .w-chrome { background: #1c2333; }
  .w-code { background: #14161d; }
  .w-figma { background: #1e1e24; }
  .w-term { background: #101014; }
  .dock-wrap {
    flex: none;
    padding: 16px 28px 22px;
  }
  .dock {
    display: flex;
    align-items: center;
    height: 92px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, #17171b, #101013);
    padding: 0 22px;
    gap: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  .toggles {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 168px;
  }
  .toggle-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--text-1);
  }
  .toggle-item svg { color: var(--text-2); }
  .toggle-item .hint { color: var(--text-3); font-size: 11px; }
  .rec-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .rec-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 3px solid rgba(255, 69, 58, 0.55);
    background: rgba(255, 69, 58, 0.08);
    display: grid;
    place-items: center;
  }
  .rec-btn i {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ff7b6e, #e22d20 75%);
    box-shadow: 0 4px 16px rgba(255, 69, 58, 0.45);
    display: block;
  }
  .rec-zone .rec-label {
    font-size: 11.5px;
    color: var(--text-3);
  }
  .rec-zone .rec-label kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--text-2);
  }
  .last {
    min-width: 240px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .last .t1 { font-size: 12px; color: var(--text-3); margin-bottom: 3px; }
  .last .t2 { font-size: 12px; color: var(--text-1); font-family: var(--mono); }
  .last .go {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="traffic"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>
  </div>
  <div class="toolbar">
    <div class="brand">
      <div class="logo">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="3"/><circle cx="12" cy="11" r="3.2"/></svg>
      </div>
      <div>
        <h1>Screen Recorder</h1>
        <p>录制时采集数据,导出时自动运镜</p>
      </div>
    </div>
    <div class="seg">
      <button class="on">录制</button>
      <button>预览</button>
    </div>
  </div>
  <div class="perm-row">
    <span class="chip"><span class="dot"></span>屏幕录制已授权</span>
    <span class="chip"><span class="dot"></span>辅助功能已授权</span>
    <span class="chip"><span class="dot"></span>麦克风已授权</span>
  </div>
  <div class="content">
    <div class="section-head" style="margin-top:2px">
      <h2>屏幕</h2>
      <span class="count">2 个显示器</span>
    </div>
    <div class="grid" style="margin-bottom:20px">
      <div class="src sel">
        <div class="thumb t-screen">
          <div class="mini" style="left:6%;top:10%;width:44%;height:64%"></div>
          <div class="mini" style="left:54%;top:10%;width:40%;height:30%;background:rgba(255,92,56,.25)"></div>
          <div class="mini" style="left:54%;top:46%;width:40%;height:28%"></div>
        </div>
        <div class="meta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span class="name">主显示器 <small>3024 x 1964</small></span>
        </div>
        <span class="badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>已选择</span>
      </div>
      <div class="src">
        <div class="thumb t-screen-2">
          <div class="mini" style="left:8%;top:14%;width:60%;height:40%"></div>
          <div class="mini" style="left:8%;top:60%;width:26%;height:26%"></div>
          <div class="mini" style="left:40%;top:60%;width:52%;height:26%;background:rgba(255,255,255,.1)"></div>
        </div>
        <div class="meta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span class="name">DELL U2723QE <small>3840 x 2160</small></span>
        </div>
      </div>
    </div>
    <div class="section-head">
      <h2>窗口</h2>
      <span class="count">4 个应用窗口</span>
    </div>
    <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="src">
        <div class="thumb w-chrome">
          <div class="mini" style="left:0;top:0;width:100%;height:14%;border-radius:0;background:rgba(255,255,255,.12)"></div>
          <div class="mini" style="left:8%;top:26%;width:52%;height:12%"></div>
          <div class="mini" style="left:8%;top:46%;width:84%;height:8%;background:rgba(255,255,255,.1)"></div>
          <div class="mini" style="left:8%;top:60%;width:70%;height:8%;background:rgba(255,255,255,.1)"></div>
          <div class="mini" style="left:8%;top:74%;width:78%;height:8%;background:rgba(255,255,255,.1)"></div>
        </div>
        <div class="meta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
          <span class="name">Chrome - 设计规范文档</span>
        </div>
      </div>
      <div class="src">
        <div class="thumb w-code">
          <div class="mini" style="left:0;top:0;width:22%;height:100%;border-radius:0;background:rgba(255,255,255,.05)"></div>
          <div class="mini" style="left:28%;top:16%;width:38%;height:7%;background:rgba(122,162,247,.5)"></div>
          <div class="mini" style="left:34%;top:30%;width:52%;height:7%;background:rgba(158,206,106,.45)"></div>
          <div class="mini" style="left:34%;top:44%;width:30%;height:7%;background:rgba(255,158,100,.5)"></div>
          <div class="mini" style="left:28%;top:58%;width:56%;height:7%;background:rgba(255,255,255,.14)"></div>
          <div class="mini" style="left:40%;top:72%;width:36%;height:7%;background:rgba(122,162,247,.4)"></div>
        </div>
        <div class="meta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
          <span class="name">VS Code - screen-recorder</span>
        </div>
      </div>
      <div class="src">
        <div class="thumb w-figma">
          <div class="mini" style="left:12%;top:16%;width:30%;height:30%;background:rgba(255,92,56,.45);border-radius:6px"></div>
          <div class="mini" style="left:50%;top:22%;width:34%;height:22%;background:rgba(122,162,247,.4);border-radius:50%"></div>
          <div class="mini" style="left:24%;top:58%;width:52%;height:24%;background:rgba(255,255,255,.1);border-radius:6px"></div>
        </div>
        <div class="meta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
          <span class="name">Figma - UI Kit 3.0</span>
        </div>
      </div>
      <div class="src">
        <div class="thumb w-term">
          <div class="mini" style="left:8%;top:16%;width:24%;height:8%;background:rgba(48,209,88,.5)"></div>
          <div class="mini" style="left:8%;top:34%;width:56%;height:8%;background:rgba(255,255,255,.16)"></div>
          <div class="mini" style="left:8%;top:52%;width:40%;height:8%;background:rgba(255,255,255,.16)"></div>
          <div class="mini" style="left:8%;top:70%;width:64%;height:8%;background:rgba(255,214,10,.4)"></div>
        </div>
        <div class="meta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
          <span class="name">终端 - zsh</span>
        </div>
      </div>
    </div>
  </div>
  <div class="dock-wrap">
    <div class="dock">
      <div class="toggles">
        <div class="toggle-item">
          <span class="switch on"></span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
          麦克风 <span class="hint">内置</span>
        </div>
        <div class="toggle-item">
          <span class="switch on"></span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
          系统音频 <span class="hint">ScreenCaptureKit</span>
        </div>
      </div>
      <div class="rec-zone">
        <div class="rec-btn"><i></i></div>
        <span class="rec-label">开始录制 <kbd>&#8984;&#8679;R</kbd></span>
      </div>
      <div class="last">
        <div>
          <div class="t1">上次录制 · 12 分钟前</div>
          <div class="t2">2026-08-21_14-02-55</div>
        </div>
        <span class="go">进入预览
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

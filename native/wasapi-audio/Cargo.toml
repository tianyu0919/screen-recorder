[package]
name = "wasapi-audio"
version = "0.1.0"
edition = "2021"
description = "Windows 系统音频原生采集 helper（WASAPI loopback → WAV）"

[[bin]]
name = "wasapi-audio"
path = "src/main.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
rubato = "0.16"

[profile.release]
opt-level = 2

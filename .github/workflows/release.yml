# GitHub Release 打包流水线：打 tag v* 时构建 macOS + Windows 产物并发布 Release
# 用法：git tag v0.1.0 && git push --tags（也可在 Actions 页手动触发）
#
# 产物未签名（无开发者证书）：
# - macOS：ad-hoc 签名 dmg，用户首次需右键 → 打开（Gatekeeper 提示）
# - Windows：NSIS 安装包，可能触发 SmartScreen，用户选"仍要运行"
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "const p=require('./package.json').version,t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p!==t){console.error('Tag '+t+' does not match package version '+p);process.exit(1)}"
      # Swift 工具链 macOS runner 自带；构建 native/sck-audio 系统音频 helper
      - run: npm run build:native
        env:
          LENZA_REQUIRE_CAPTION_HELPER: '1'
      - run: npm run build
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 无证书：跳过签名发现，ad-hoc 签名
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Rust 工具链：构建 native/wasapi-audio 系统音频 helper
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "const p=require('./package.json').version,t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p!==t){console.error('Tag '+t+' does not match package version '+p);process.exit(1)}"
      - run: npm run build:native
        env:
          LENZA_REQUIRE_CAPTION_HELPER: '1'
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史与 tag 以计算上一版本与提交清单
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 按模板 .github/RELEASE_TEMPLATE.md 生成发版说明（分类约定见 scripts/release-notes.mjs）
      - run: node scripts/release-notes.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true # 模板之后追加 GitHub 自动变更清单
